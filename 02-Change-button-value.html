<!--
    Version 1: Original (Beginner) Version
    Uses inline onclick="" and innerHTML
-->
<html>
    <head>
        <title>Change Button Function</title>
    </head>
    <body>
        <p id="demo">Hello World!!</p>
        <button type="button" onclick="myFunc()">Change Value</button>

        <script>
            function myFunc(){
                document.getElementById("demo").innerHTML="Hello Everyone!!";
            }
        </script>
    </body>
</html>


<!--
    Version 2: Refined (Modern) Version
    Uses addEventListener + textContent instead
    of inline onclick and innerHTML
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Button Function</title>
</head>
<body>
    <p id="demo">Hello World!!</p>
    <button type="button" id="changeBtn">Change Value</button>

    <script>
        // addEventListener: modern way to attach a click handler in JS instead of inline HTML
        document.getElementById("changeBtn").addEventListener("click", myFunc);

        function myFunc() {
            document.getElementById("demo").textContent = "Hello Everyone!!";
        }
    </script>
</body>
</html>
