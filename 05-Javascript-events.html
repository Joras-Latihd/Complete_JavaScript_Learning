<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onclick Event</title>
  </head>
  <body>
    <!--
    Version 1: onclick Event Handler
    Assigns a function to the button's onclick property so it
    runs whenever the button is clicked
    -->
    <button id="btn">Click Me</button>

    <script>
      const btn = document.getElementById("btn");

      /*
        Event Handler
        The block of code assigned to btn.onclick is called an
        "event handler" — it only runs when the click event fires,
        not immediately when the script loads.
        */
      btn.onclick = function () {
        alert(
          "The button was clicked and the task is to show this dialog box.",
        );
      };

      /*
Version 2: addEventListener
A more modern way to attach event handlers. Unlike onclick,
addEventListener lets you attach multiple handlers to the same
event without overwriting each other.
*/
      const btn2 = document.getElementById("btn");

      btn2.addEventListener("click", function () {
        alert("The button was clicked using addEventListener.");
      });

      /*
Version 3: mouseover / mouseout Events
Fires when the mouse pointer enters (mouseover) or leaves (mouseout)
an element — commonly used for hover effects.
*/
      const btn3 = document.getElementById("btn");

      btn3.addEventListener("mouseover", function () {
        btn3.textContent = "Hovering!";
      });

      btn3.addEventListener("mouseout", function () {
        btn3.textContent = "Click Me";
      });

      /*
Version 4: keydown / keyup Events
Fires when a key is pressed down (keydown) or released (keyup)
while an element (or the document) has focus. The event object
gives details about which key was used via event.key.
*/
      document.addEventListener("keydown", function (event) {
        console.log("Key pressed:", event.key);
      });

      document.addEventListener("keyup", function (event) {
        console.log("Key released:", event.key);
      });

      /*
Version 5: focus / blur Events
Fires when an element gains focus (focus) or loses it (blur) —
common for form inputs, but works on any focusable element
like a button too.
*/
      const btn4 = document.getElementById("btn");

      btn4.addEventListener("focus", function () {
        console.log("Button is focused");
      });

      btn4.addEventListener("blur", function () {
        console.log("Button lost focus");
      });
    </script>
  </body>
</html>
