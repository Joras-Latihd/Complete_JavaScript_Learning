<html>
    <head>
        <title>Displaying with dialog box</title>
    </head>
    <body>
        <button type="button" onclick="myFunc()">Sum</button>

        <script>
            function myFunc(){
                const x = 10;
                const y = 14;
                const sum = x + y;
                alert(sum);
            }
        </script>
    </body>
</html>
